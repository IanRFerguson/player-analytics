[project]
name = "player-analytics"
version = "0.1.0"
description = "This is a full stack analytics project to model and display Knicks player data."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "click>=8.3.2",
    "colorlog>=6.10.1",
    "dlt[bigquery]>=1.25.0",
    "pydantic>=2.13.1",
]

[tool.ruff]
line-length = 88
indent-width = 4
target-version = "py312"
exclude = ["dbt-tmc"]

[tool.ruff.lint]
extend-ignore = [
    "F401",
    "E203",
    "E266",
    "E402",
    "E501",
    "E711",
    "E712",
    "F403",
    "F821",
]
select = ["E", "F", "I"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "auto"
docstring-code-format = false
docstring-code-line-length = "dynamic"

[tool.mypy]
# Strict type checking configuration
strict = true
ignore_missing_imports = true
mypy_path = "."
explicit_package_bases = true
disable_error_code = ["no-redef"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
filterwarnings = ["ignore::FutureWarning"]

[dependency-groups]
development = [
    "mypy>=1.20.1",
    "pytest>=9.0.3",
    "ruff>=0.15.11",
]
